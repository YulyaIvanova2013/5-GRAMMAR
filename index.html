<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ВПР 5 класс — Грамматика</title>
<style>
:root{--ink:#17324d;--cream:#fff8e7;--shadow:0 16px 40px rgba(24,58,86,.18);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:#dff5ff;color:var(--ink)}
button{font:inherit}
.screen{position:fixed;inset:0;display:none;overflow:hidden}
.screen.active{display:flex}

/* COVER */
#cover{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#fff7c8 0,#dff5ff 45%,#bfe9ff 100%)}
.cover-stage{position:relative;width:min(100vw,calc(100dvh * 1.77683));aspect-ratio:1672/941;filter:drop-shadow(0 12px 28px rgba(25,67,96,.22))}
.cover-stage img{width:100%;height:100%;display:block;object-fit:contain}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:5%;outline:none}
.hotspot::after{content:"";position:absolute;inset:4%;border:4px solid transparent;border-radius:7%;transition:.2s}
.hotspot:hover::after,.hotspot:focus-visible::after{border-color:#fff;box-shadow:0 0 0 5px rgba(255,196,0,.85),0 0 28px rgba(255,196,0,.8)}
.hotspot.secret{left:1.5%;top:1.2%;width:32.5%;height:42.5%}
.hotspot.zoo{left:64.5%;top:1.2%;width:34%;height:42.5%}
.hotspot.robot{left:1.2%;top:44.2%;width:33.2%;height:41.7%}
.hotspot.bottle{left:66.2%;top:44.2%;width:32.3%;height:41.7%}
.done-badge{position:absolute;right:2%;top:2%;width:12%;aspect-ratio:1;border-radius:50%;background:#18bf66;color:#fff;display:none;align-items:center;justify-content:center;font-size:clamp(18px,2.3vw,36px);font-weight:900;border:3px solid #fff;box-shadow:0 5px 14px rgba(0,0,0,.22)}
.hotspot.done .done-badge{display:flex}

.mobile-cover{display:none;width:100%;height:100%;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:linear-gradient(#dff7ff,#fff7d7);flex-direction:column;gap:8px}
.m-head{height:16%;min-height:92px;display:flex;align-items:center;justify-content:center;position:relative;text-align:center}
.m-logo{position:absolute;right:2px;top:2px;width:64px;height:64px;border-radius:50%;box-shadow:0 4px 12px #7da7bd55}
.m-title{font-size:clamp(28px,8vw,42px);font-weight:1000;line-height:.98;color:#0b69c7;text-shadow:0 3px #fff,0 6px #ffc400}
.m-title small{display:block;color:#e63e72;font-size:.55em;margin-top:6px}
.m-tip{font-weight:800;text-align:center;font-size:clamp(14px,4vw,18px);background:#fff6d8;border:2px solid #f4bd3f;padding:6px 12px;border-radius:999px;box-shadow:0 4px 10px #a66f1b22}
.m-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:auto;gap:10px;min-height:0;align-content:center}
.m-card{position:relative;border:0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 8px 18px rgba(35,88,120,.18);padding:0;cursor:pointer;aspect-ratio:1.42}
.m-card img{width:100%;height:100%;object-fit:cover;display:block;background:#fff;border-radius:18px}
.m-card.done::after{content:"✓";position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#19bf68;color:#fff;font-weight:1000;font-size:22px;border:2px solid #fff;box-shadow:0 3px 9px #0003}

/* TASK PAGE */
.task-screen{--accent:#f59a23;--accent2:#ffd65a;--soft:#fff3d4;flex-direction:column;background:
radial-gradient(circle at 8% 10%,color-mix(in srgb,var(--accent) 18%,transparent) 0 12%,transparent 13%),
linear-gradient(135deg,#f6fbff 0%,var(--soft) 100%)}
.task-screen.blue{--accent:#1a98f0;--accent2:#69d6ff;--soft:#eaf8ff}
.task-screen.green{--accent:#35b85c;--accent2:#85e77f;--soft:#ecfff0}
.task-screen.coral{--accent:#f06452;--accent2:#ffad74;--soft:#fff0e7}
.task-top{height:13dvh;min-height:82px;display:flex;align-items:center;gap:14px;padding:8px clamp(10px,2vw,24px);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 90%,white),color-mix(in srgb,var(--accent2) 75%,white));border-bottom:4px solid #fff;box-shadow:0 6px 18px #24506b1f}
.home-btn{width:68px;height:68px;border:0;border-radius:22px;background:linear-gradient(145deg,#36d8ff 0%,#1597ff 48%,#7568ff 100%);cursor:pointer;box-shadow:0 7px 0 #2357b8,0 12px 24px rgba(20,78,160,.28),inset 0 2px 8px rgba(255,255,255,.55);border:4px solid #fff;display:grid;place-items:center;position:relative;overflow:hidden;transition:.16s}
.home-btn::before{content:"";position:absolute;width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.35);top:-7px;left:7px;filter:blur(1px)}
.home-btn::after{content:"✦";position:absolute;right:5px;top:2px;color:#fff36a;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.18)}
.home-btn:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 9px 0 #2357b8,0 16px 28px rgba(20,78,160,.30),inset 0 2px 8px rgba(255,255,255,.6)}
.home-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #2357b8,0 5px 12px rgba(0,0,0,.16)}
.home-btn svg{width:40px;height:40px;display:block;position:relative;z-index:2;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.home-btn .roof{fill:#ff4f68}
.home-btn .body{fill:#fff9e8}
.home-btn .door{fill:#ffd447}
.home-btn .window{fill:#5ed7ff}
.home-btn .outline{fill:#173f76}
.thumb{height:calc(13dvh - 18px);max-height:88px;aspect-ratio:1.42;border-radius:20px;object-fit:cover;border:4px solid #fff;box-shadow:0 4px 10px #0002;background:#fff}
.task-title{min-width:0;flex:1;color:#fff;text-shadow:0 2px 3px #0003}
.task-title b{display:block;font-size:clamp(22px,3.4vw,38px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-title span{display:block;font-size:clamp(13px,1.7vw,19px);font-weight:800;margin-top:5px}
.progress{background:#ffffffd9;color:var(--ink);padding:8px 12px;border-radius:999px;font-weight:900;white-space:nowrap;box-shadow:0 3px 8px #0001}

.task-main{height:72dvh;min-height:0;padding:clamp(8px,1.4vh,14px) clamp(10px,2vw,24px);display:flex;align-items:center;justify-content:center}
.story-card{width:min(1140px,100%);height:100%;background:#fffdf8;border-radius:30px;border:4px solid color-mix(in srgb,var(--accent) 48%,white);box-shadow:var(--shadow);padding:clamp(16px,2.3vh,26px) clamp(16px,2.7vw,34px);display:flex;flex-direction:column;justify-content:flex-start;position:relative;overflow:visible}
.story-card::before,.story-card::after{position:absolute;font-size:clamp(36px,5vw,74px);opacity:.09;filter:saturate(.7)}
.story-card::before{content:attr(data-icon);left:1.5%;top:2%}
.story-card::after{content:attr(data-icon);right:1.5%;bottom:1%;transform:rotate(-12deg)}
.story-hint{font-size:clamp(15px,2vh,21px);font-weight:900;color:color-mix(in srgb,var(--accent) 82%,#344);margin-bottom:clamp(10px,1.3vh,16px);text-align:center}
.story{font-family:"Arial Rounded MT Bold","Trebuchet MS","Comic Sans MS",Arial,sans-serif;font-size:clamp(27px,3.35vh,38px);line-height:1.68;font-weight:700;color:#253b4d;text-align:left;position:relative;z-index:1;letter-spacing:.01em}
.blank{display:inline-flex;align-items:center;justify-content:center;gap:.28em;min-width:98px;max-width:180px;height:1.7em;padding:0 .62em;margin:0 .18em;border-radius:16px;border:3px solid color-mix(in srgb,var(--accent) 60%,white);background:linear-gradient(#fff,var(--soft));color:var(--ink);font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;font-size:.88em;font-weight:1000;vertical-align:.08em;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 35%,white);cursor:pointer;transition:.16s;position:relative}
.blank:hover{transform:translateY(-1px);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 35%,white)}
.blank.empty{color:#7c8a94}.blank .arr{font-size:.82em;line-height:1;opacity:.85}
.blank.correct{background:#dcf9e6;border-color:#25b45a;color:#14793b;box-shadow:0 0 0 3px #b6efc9}
.blank.wrong{background:#ffe1df;border-color:#e34f4f;color:#a92626;box-shadow:0 0 0 3px #ffc0bb}
.blank.focus-error{animation:pulse .75s ease 2}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 7px #ffd22eaa}}

.task-bottom{height:15dvh;min-height:92px;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#ffffffd9;border-top:1px solid #dbe7ee;backdrop-filter:blur(8px)}
.status{font-size:clamp(14px,1.85vw,20px);font-weight:900;min-width:190px;text-align:right}
.check-btn,.next-btn{border:0;border-radius:18px;padding:15px 28px;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 78%,white),var(--accent));font-size:clamp(18px,2.2vw,24px);font-weight:1000;box-shadow:0 7px 0 color-mix(in srgb,var(--accent) 72%,#344),0 10px 20px #0002;cursor:pointer;min-width:230px}
.check-btn:active,.next-btn:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 72%,#344)}
.check-btn:disabled{filter:grayscale(.7);opacity:.48;cursor:not-allowed;box-shadow:0 4px 0 #8795a1}

/* inline choices */
.inline-choice{position:fixed;z-index:24;display:none;min-width:min(680px,calc(100vw - 20px));max-width:min(720px,calc(100vw - 20px));background:#fff;border-radius:28px;padding:14px 14px 16px;box-shadow:0 18px 44px rgba(0,0,0,.20);border:4px solid var(--accent)}
.inline-choice.show{display:block}
.inline-choice::before{content:"";position:absolute;top:-14px;left:var(--arrow-left,42px);width:22px;height:22px;background:#fff;border-left:4px solid var(--accent);border-top:4px solid var(--accent);transform:rotate(45deg);border-top-left-radius:7px}
.inline-choice h3{margin:0 0 10px;font-size:clamp(18px,2.3vw,24px);font-weight:1000;color:var(--ink)}
.inline-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.inline-option{border:3px solid color-mix(in srgb,var(--accent) 55%,white);border-radius:18px;background:linear-gradient(#fff,var(--soft));padding:16px 10px;font-size:clamp(24px,2.5vw,30px);font-weight:1000;cursor:pointer;color:var(--ink);font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 35%,white)}
.inline-option:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 35%,white)}
.inline-option:hover{transform:translateY(-1px)}
.inline-close{position:absolute;right:10px;top:10px;border:0;background:#eff5f8;border-radius:12px;width:38px;height:38px;font-size:22px;font-weight:900;cursor:pointer}

/* results */
.result-layer{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#15374c99;padding:12px}
.result-layer.show{display:flex}
.result-box{width:min(720px,100%);max-height:92dvh;background:#fff;border-radius:28px;padding:clamp(16px,3vh,28px);box-shadow:0 20px 70px #0006;border:5px solid var(--accent);text-align:center;overflow:hidden}
.score-ring{width:92px;height:92px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--score)*60deg),#e9eef1 0);position:relative}
.score-ring::after{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}
.score-text{position:relative;z-index:1;font-size:24px;font-weight:1000;color:var(--ink)}
.result-title{font-size:clamp(22px,4vw,34px);font-weight:1000;margin:2px 0 8px;color:var(--ink)}
.explain-card{text-align:left;background:var(--soft);border:3px solid color-mix(in srgb,var(--accent) 38%,white);border-radius:20px;padding:14px 16px;margin:10px 0;min-height:118px}
.explain-card b{font-size:clamp(18px,3vw,23px);display:block;margin-bottom:6px;color:color-mix(in srgb,var(--accent) 80%,#333)}
.explain-card p{margin:0;font-size:clamp(16px,2.5vw,21px);line-height:1.5;font-weight:700}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.rbtn{border:0;border-radius:16px;padding:13px 18px;font-weight:1000;font-size:16px;cursor:pointer}
.rbtn.primary{background:var(--accent);color:#fff}
.rbtn.soft{background:#eaf1f5;color:var(--ink)}
.err-count{font-size:13px;font-weight:900;color:#70818d;margin-top:2px}

@media (max-width:700px){
  .cover-stage{display:none}.mobile-cover{display:flex}
  .task-top{height:10dvh;min-height:72px;padding:6px 8px;gap:7px}
  .home-btn{width:58px;height:58px;border-radius:19px;font-size:25px}
  .home-btn svg{width:33px;height:33px}
  .thumb{height:54px;max-height:none;aspect-ratio:1.38;border-radius:16px}
  .task-title b{font-size:clamp(17px,5vw,23px)}
  .task-title span{font-size:11px;margin-top:2px}
  .progress{font-size:12px;padding:6px 8px}
  .task-main{height:73dvh;padding:7px}
  .story-card{border-radius:22px;border-width:3px;padding:10px 12px 12px}
  .story-hint{font-size:12px;margin-bottom:5px}
  .story{font-size:clamp(20px,3.05vh,25px);line-height:1.56}
  .blank{min-width:80px;max-width:140px;border-radius:12px;padding:0 .48em;font-size:.86em}
  .task-bottom{height:17dvh;min-height:108px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));gap:8px;flex-wrap:wrap}
  .status{min-width:0;flex:1 1 100%;text-align:center;font-size:13px;line-height:1.2;order:2}
  .check-btn{min-width:170px;padding:12px 15px;border-radius:15px;font-size:17px;order:1}
  .inline-choice{min-width:min(96vw,520px);padding:12px 10px 12px;border-radius:22px}
  .inline-choice::before{left:var(--arrow-left,36px);top:-12px;width:18px;height:18px;border-left-width:3px;border-top-width:3px}
  .inline-choices{grid-template-columns:1fr;gap:8px}
  .inline-option{padding:12px 10px;font-size:20px}
  .inline-close{width:34px;height:34px;font-size:18px}
  .result-box{border-radius:22px;padding:14px 12px}
  .score-ring{width:76px;height:76px}
  .explain-card{padding:12px;min-height:110px}
}
@media (max-height:650px){
  .task-top{height:11dvh;min-height:50px}
  .task-main{height:76dvh;padding:5px 8px}
  .task-bottom{height:13dvh;min-height:58px}
  .thumb{height:52px;border-radius:14px}
  .home-btn{width:46px;height:46px;border-radius:15px}
  .home-btn svg{width:27px;height:27px}
  .story-card{padding:8px 10px 10px}
  .story-hint{display:none}
  .story{font-size:clamp(18px,2.85vh,22px);line-height:1.5}
  .check-btn{padding:10px 13px;font-size:15px;min-width:150px}
}

/* ===== MOBILE-FIRST FINAL TUNING ===== */
@media (max-width:700px){
  html,body{height:100dvh;min-height:100dvh;overflow:hidden}
  .screen{height:100dvh;min-height:100dvh;overflow:hidden}

  /* mobile cover */
  .mobile-cover{display:flex;height:100dvh;min-height:100dvh;padding:max(6px,env(safe-area-inset-top)) 7px max(7px,env(safe-area-inset-bottom));gap:6px;overflow:hidden}
  .m-head{height:13dvh;min-height:72px;max-height:104px;flex:0 0 auto}
  .m-logo{width:54px;height:54px;right:0;top:0}
  .m-title{font-size:clamp(25px,7.2vw,36px);line-height:.94;padding:0 54px}
  .m-title small{font-size:.5em;margin-top:4px}
  .m-tip{font-size:clamp(12px,3.4vw,16px);padding:5px 9px;line-height:1.15;flex:0 0 auto}
  .m-grid{min-height:0;flex:1;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:7px;align-content:stretch}
  .m-card{height:100%;min-height:0;aspect-ratio:auto;border-radius:17px;box-shadow:0 5px 14px rgba(35,88,120,.18)}
  .m-card img{width:100%;height:100%;object-fit:cover;border-radius:15px}
  .m-card.done::after{width:29px;height:29px;font-size:18px;top:5px;right:5px}

  /* task header */
  .task-top{height:10dvh;min-height:68px;max-height:82px;padding:5px 7px;gap:7px;flex:0 0 auto}
  .home-btn{width:52px;height:52px;border-radius:17px;flex:0 0 52px;border-width:3px}
  .home-btn svg{width:29px;height:29px}
  .thumb{height:52px;width:74px;max-height:none;aspect-ratio:auto;border-radius:15px;border-width:3px;object-fit:cover;flex:0 0 74px}
  .task-title{min-width:0}
  .task-title b{font-size:clamp(17px,4.9vw,23px);line-height:1.02}
  .task-title span{font-size:10.5px;line-height:1.08;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .progress{font-size:11px;padding:6px 7px}

  /* task body */
  .task-main{height:77dvh;min-height:0;padding:6px 7px;align-items:stretch;flex:1 1 auto}
  .story-card{height:100%;min-height:0;border-radius:21px;border-width:3px;padding:9px 11px 10px;justify-content:flex-start;overflow:hidden}
  .story-card::before,.story-card::after{font-size:38px}
  .story-hint{font-size:11.5px;line-height:1.15;margin:0 0 6px}
  .story{font-size:clamp(17.5px,4.45vw,21px);line-height:1.47;letter-spacing:0;font-weight:700}
  .blank{min-width:68px;max-width:126px;height:1.62em;border-radius:11px;border-width:2px;padding:0 .38em;margin:0 .09em;font-size:.84em;box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 35%,white)}

  /* bottom controls */
  .task-bottom{height:13dvh;min-height:82px;max-height:104px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:5px;flex:0 0 auto;flex-wrap:nowrap}
  .status{min-width:0;flex:1 1 auto;order:1;text-align:left;font-size:11.5px;line-height:1.15}
  .check-btn{order:2;min-width:132px;padding:11px 14px;border-radius:14px;font-size:17px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 72%,#344),0 7px 14px #0002}

  /* answer choices: compact, beside the blank, no full-screen popup */
  .inline-choice{min-width:0;width:calc(100vw - 16px);max-width:430px;padding:11px 9px 10px;border-radius:20px;border-width:3px;box-shadow:0 13px 32px rgba(0,0,0,.22)}
  .inline-choice h3{font-size:16px;line-height:1.1;padding-right:32px;margin:0 0 8px}
  .inline-close{width:31px;height:31px;right:7px;top:7px;border-radius:10px;font-size:17px}
  .inline-choices{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .inline-option{padding:10px 4px;border-radius:13px;border-width:2px;font-size:clamp(17px,4.6vw,20px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 35%,white)}

  /* result explanations */
  .result-layer{padding:8px}
  .result-box{width:calc(100vw - 16px);max-height:94dvh;border-radius:21px;border-width:4px;padding:12px 10px;overflow:hidden}
  .score-ring{width:66px;height:66px;margin-bottom:6px}
  .score-ring::after{inset:8px}
  .score-text{font-size:19px}
  .result-title{font-size:clamp(20px,5.6vw,25px);margin:2px 0 5px}
  .explain-card{min-height:0;padding:10px 11px;margin:7px 0;border-radius:16px;border-width:2px}
  .explain-card b{font-size:17px;margin-bottom:4px}
  .explain-card p{font-size:15.5px;line-height:1.4}
  .result-actions{margin-top:8px;gap:6px}
  .rbtn{padding:10px 12px;border-radius:13px;font-size:14.5px}
}

/* extra-small phones */
@media (max-width:390px) and (max-height:760px){
  .m-head{height:12dvh;min-height:64px}
  .m-title{font-size:24px}
  .m-tip{font-size:11.5px;padding:4px 7px}
  .m-grid{gap:5px}
  .task-top{height:10dvh;min-height:62px}
  .home-btn{width:46px;height:46px;flex-basis:46px}
  .home-btn svg{width:26px;height:26px}
  .thumb{height:46px;width:65px;flex-basis:65px}
  .task-title b{font-size:16px}
  .task-title span{font-size:9.5px}
  .progress{font-size:10px;padding:5px 6px}
  .task-main{height:78dvh;padding:5px}
  .story-card{padding:7px 9px 8px}
  .story-hint{display:none}
  .story{font-size:clamp(16px,4.15vw,18.5px);line-height:1.42}
  .blank{min-width:62px;max-width:114px;font-size:.82em}
  .task-bottom{height:12dvh;min-height:72px;padding:5px 7px calc(5px + env(safe-area-inset-bottom))}
  .status{font-size:10.5px}
  .check-btn{min-width:118px;font-size:15.5px;padding:9px 11px}
  .inline-option{font-size:16px;padding:9px 3px}
  .inline-choice h3{font-size:14.5px}
}

/* mobile landscape */
@media (max-height:540px) and (orientation:landscape){
  .mobile-cover{padding:4px 6px;gap:4px}
  .m-head{height:17dvh;min-height:48px;max-height:66px}
  .m-logo{width:42px;height:42px}
  .m-title{font-size:25px}
  .m-tip{font-size:11px;padding:3px 8px}
  .m-grid{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr;gap:5px}
  .task-top{height:15dvh;min-height:54px}
  .home-btn{width:44px;height:44px;flex-basis:44px}
  .home-btn svg{width:24px;height:24px}
  .thumb{height:43px;width:62px;flex-basis:62px}
  .task-main{height:69dvh;padding:4px 6px}
  .story-card{padding:6px 10px}
  .story-hint{display:none}
  .story{font-size:clamp(14px,3.4vh,17px);line-height:1.35}
  .blank{min-width:58px;max-width:105px;height:1.5em;font-size:.82em}
  .task-bottom{height:16dvh;min-height:58px;max-height:72px;padding:4px 7px}
  .status{font-size:10px}
  .check-btn{min-width:120px;font-size:14px;padding:8px 11px}
  .inline-choice{max-width:500px;padding:7px 8px}
  .inline-choice h3{font-size:13px;margin-bottom:5px}
  .inline-option{font-size:15px;padding:7px 4px}
}

</style>

const cover=$('#cover'), taskScreen=$('#task');

function completedSet(){try{return new Set(JSON.parse(localStorage.getItem('vpr5done')||'[]'))}catch(e){return new Set()}}
function saveDone(id){const s=completedSet();s.add(id);localStorage.setItem('vpr5done',JSON.stringify([...s]));refreshDone()}
function refreshDone(){const s=completedSet();$$('[data-open]').forEach(el=>el.classList.toggle('done',s.has(el.dataset.open)))}
refreshDone();

$$('[data-open]').forEach(btn=>btn.addEventListener('click',()=>openTask(btn.dataset.open)));
$('#homeBtn').addEventListener('click',showCover);
function showCover(){closeChoice();closeResults();taskScreen.classList.remove('active');cover.classList.add('active');refreshDone()}

function openTask(id){
  current=TASKS.find(t=>t.id===id);answers={};errors=[];errorIndex=0;
  cover.classList.remove('active');taskScreen.className='screen task-screen active '+current.theme;
  $('#taskTitle').textContent=current.title;$('#progress').textContent=(TASKS.indexOf(current)+1)+' / '+TASKS.length;
  $('#taskThumb').src=IMAGES[id];$('#taskThumb').alt=current.title;$('#storyCard').dataset.icon=current.icon;
  renderStory();updateStatus();
}

function renderStory(){
 const story=$('#story');story.innerHTML='';
 current.body.forEach(part=>{
   if(typeof part==='string'){story.append(document.createTextNode(part));return}
   const g=part.gap,b=document.createElement('button');
   b.className='blank '+(answers[g]?'':'empty');b.dataset.gap=g;
   b.innerHTML=`<span>${answers[g]||g}</span><span class="arr">▾</span>`;
   b.setAttribute('aria-label','Пропуск '+g);
   b.onclick=(e)=>{e.stopPropagation();toggleChoice(g,b)};
   story.append(b);
 });
}
function toggleChoice(g,anchor){
 const box=$('#inlineChoice');
 const same=currentGap===g && box.classList.contains('show');
 if(same){closeChoice();return}
 currentGap=g;const q=current.qs[g];$('#choiceTitle').textContent='Пропуск '+g+' — выбери ответ';
 box.style.setProperty('--accent',getComputedStyle(taskScreen).getPropertyValue('--accent'));
 box.style.setProperty('--soft',getComputedStyle(taskScreen).getPropertyValue('--soft'));
 $('#choices').innerHTML='';
 q.options.forEach(opt=>{
   const b=document.createElement('button');
   b.className='inline-option';
   b.textContent=opt;
   b.onclick=(e)=>{e.stopPropagation();answers[g]=opt;closeChoice();renderStory();updateStatus();};
   $('#choices').append(b)
 });
 box.classList.add('show');
 requestAnimationFrame(()=>positionChoice(anchor,box));
}
function positionChoice(anchor,box){
 const r=anchor.getBoundingClientRect();
 const w=Math.min(box.offsetWidth||600, window.innerWidth-20);
 let left=Math.max(10, Math.min(r.left + r.width/2 - w/2, window.innerWidth - w - 10));
 let top=r.bottom + 12;
 const boxH=box.offsetHeight||140;
 if(top + boxH > window.innerHeight - 10) top=Math.max(10, r.top - boxH - 12);
 box.style.left=left+'px';
 box.style.top=top+'px';
 const arrow=Math.max(28, Math.min(w-36, r.left + r.width/2 - left - 11));
 box.style.setProperty('--arrow-left',arrow+'px');
}
function closeChoice(){const box=$('#inlineChoice');box.classList.remove('show');currentGap=null}
$('#choiceClose').onclick=(e)=>{e.stopPropagation();closeChoice()};
document.addEventListener('click',e=>{const box=$('#inlineChoice'); if(box.classList.contains('show')&&!box.contains(e.target)&&!e.target.closest('.blank')) closeChoice();});
window.addEventListener('resize',()=>{const box=$('#inlineChoice'); if(box.classList.contains('show') && currentGap){const anchor=$(`.blank[data-gap="${currentGap}"]`); if(anchor) positionChoice(anchor,box);}});
function updateStatus(){
 const n=Object.keys(answers).length;$('#checkBtn').disabled=n<6;$('#status').textContent=n<6?`Заполнено ${n} из 6`:'Готово! Нажми CHECK';
}

$('#checkBtn').onclick=checkAnswers;
function checkAnswers(){
 errors=[];
 $$('.blank').forEach(b=>{const g=b.dataset.gap,ok=answers[g]===current.qs[g].answer;b.classList.remove('correct','wrong');b.classList.add(ok?'correct':'wrong');if(!ok)errors.push(g)});
 const score=6-errors.length;showResults(score);
}
function showResults(score){
 $('#resultBox').style.setProperty('--accent',getComputedStyle(taskScreen).getPropertyValue('--accent'));
 $('#resultBox').style.setProperty('--soft',getComputedStyle(taskScreen).getPropertyValue('--soft'));
 $('#scoreRing').style.setProperty('--score',score);$('#scoreText').textContent=score+'/6';
 if(score===6){
   saveDone(current.id);$('#resultTitle').textContent='Отлично! Всё правильно 🎉';
   $('#resultBody').innerHTML='<div class="explain-card"><b>Супер!</b><p>Ты правильно выбрал все 6 форм. Можно переходить к следующему тексту.</p></div>';
   const idx=TASKS.indexOf(current),next=TASKS[(idx+1)%TASKS.length];
   $('#resultActions').innerHTML='';
   const home=mkBtn('На главную','soft',showCover);$('#resultActions').append(home);
   if(idx<TASKS.length-1)$('#resultActions').append(mkBtn('Следующее задание →','primary',()=>{closeResults();openTask(next.id)}));
 } else {
   errorIndex=0;renderError();
 }
 $('#resultLayer').classList.add('show');
}
function renderError(){
 const g=errors[errorIndex],q=current.qs[g];
 $('#resultTitle').textContent='Разберём ошибки 🙂';
 $('#resultBody').innerHTML=`<div class="err-count">Ошибка ${errorIndex+1} из ${errors.length}</div><div class="explain-card"><b>Пропуск ${g}: нужно “${q.answer}”</b><p>${q.explain}</p></div>`;
 $('#resultActions').innerHTML='';
 if(errorIndex>0)$('#resultActions').append(mkBtn('← Назад','soft',()=>{errorIndex--;renderError();highlightError()}));
 if(errorIndex<errors.length-1)$('#resultActions').append(mkBtn('Следующая ошибка →','primary',()=>{errorIndex++;renderError();highlightError()}));
 else $('#resultActions').append(mkBtn('Исправить ответы','primary',()=>{closeResults();clearEvaluation()}));
 highlightError();
}
function highlightError(){
 $$('.blank').forEach(b=>b.classList.remove('focus-error'));
 const g=errors[errorIndex],el=$(`.blank[data-gap="${g}"]`);if(el){void el.offsetWidth;el.classList.add('focus-error')}
}
function clearEvaluation(){$$('.blank').forEach(b=>b.classList.remove('correct','wrong','focus-error'));$('#status').textContent='Исправь ошибки и проверь ещё раз'}
function mkBtn(text,cls,fn){const b=document.createElement('button');b.className='rbtn '+cls;b.textContent=text;b.onclick=fn;return b}
function closeResults(){$('#resultLayer').classList.remove('show')}

// keyboard support
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeChoice();closeResults()}});
</script>
</body>
</html>
